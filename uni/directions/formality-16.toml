# The formality contrast pushed at layer 16: its template and pairs, word for word, at the layer halfway
# through a 32-layer model, as formality's layer 12 is halfway through a 24-layer one. For the second
# pinned model, whose answer pushed at layer 12 leaves the pushes it can be read at before it doubles twice.
# Each pair is read as the model's own reply to the template; `uni direction formality-16 --model MODEL` derives it.

template = "rewrite"
layer = 16

[[pairs]]
text = "The meeting moved to Thursday because the room was booked."
toward = "The meeting has been rescheduled to Thursday, as the room was previously reserved."
away = "Heads up, the meeting's on Thursday now, the room was taken."

[[pairs]]
text = "We could not ship the update this week."
toward = "We regret to inform you that the update could not be released this week."
away = "Yeah, the update didn't make it out this week, sorry."

[[pairs]]
text = "Thanks for sending the report so quickly."
toward = "Thank you for providing the report so promptly; it is much appreciated."
away = "Thanks a ton for getting the report over so fast!"

[[pairs]]
text = "The printer on the second floor is broken again."
toward = "Please be advised that the printer on the second floor is once again out of service."
away = "Ugh, the printer upstairs is busted again."

[[pairs]]
text = "Can you check the numbers before Friday?"
toward = "Would you kindly review the figures prior to Friday?"
away = "Hey, can you look over the numbers before Friday?"

[[pairs]]
text = "The park is closed for repairs until spring."
toward = "The park will remain closed for maintenance until the spring season."
away = "The park's shut for fixing up till spring."

[[pairs]]
text = "I think the plan needs more time."
toward = "In my assessment, the proposal requires additional time for development."
away = "Honestly I think the plan needs a bit more time."

[[pairs]]
text = "The train was late, so I missed the start of the show."
toward = "Owing to the delayed arrival of the train, I was unable to attend the beginning of the performance."
away = "Train was late so I totally missed the start of the show."
