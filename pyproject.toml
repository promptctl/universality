[project]
name = "universality"
version = "0.0.0"
description = "Feigenbaum universality in LLM feedback loops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
uni = "uni.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
